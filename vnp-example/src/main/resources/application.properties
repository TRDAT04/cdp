server.port=9001
scope.service=example
server.forward-headers-strategy=framework
spring.threads.virtual.enabled=true

# ==============================
# MANAGEMENT PORT
# ==============================
#management.server.port=8081
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info

# health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

management.endpoint.health.group.readiness.include=r2dbc,mock,mockDb
management.endpoint.health.group.liveness.include=ping,mock,mockDb

# dependency health
management.health.db.enabled=true
management.health.diskspace.enabled=true

## PostgreSQL R2DBC
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:172.20.0.70}:${DB_PORT:5432}/${DB_NAME:cdp}
spring.r2dbc.username=${DB_USERNAME:cdp}
spring.r2dbc.password=${DB_PASSWORD:cdp}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.max-size=${R2DBC_POOL_MAX_SIZE:10}
spring.r2dbc.pool.initial-size=${R2DBC_POOL_INITIAL_SIZE:10}

logging.level.org.springframework.security=${SPRING_SECURITY_LOG:DEBUG}
logging.level.org.springframework.security.web.FilterChainProxy=WARN

spring.data.redis.database=15
spring.data.redis.host=172.20.0.70
spring.data.redis.port=6379
spring.data.redis.password=redis@Uat26
spring.data.redis.timeout=60000

syslog.save=true
syslog.host=http://localhost:9001

# --- JWT validation (lay public key tu .NET Core de verify chu ky) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://uat-pcm.vnpost.vn/gw/coreapief}
# --- Goi sang Core de check token con hieu luc / lay danh sach quyen ---
core.dsAPI=${CORE_API:/AzPermissions/GetsPermissionByCodeAzService/APP_CODE}
core.validToken=${CORE_VALID_TOKEN:/users/ValidateToken}
cors.allowed-origin-patterns=*

# ==============================
# KAFKA
# ==============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:172.23.0.17:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:vnpost-cdp-group-v1}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false

app.kafka.topic.profile-event=${KAFKA_PROFILE_EVENT_TOPIC:cdp.profile.events}
app.kafka.topic.customer-event=${KAFKA_CUSTOMER_EVENT_TOPIC:cdp.customer.events}

# ==============================
# APACHE UNOMI (profile behavior enrichment)
# ==============================
app.unomi.base-url=${UNOMI_BASE_URL:http://172.23.0.17:8181}
app.unomi.username=${UNOMI_USERNAME:karaf}
app.unomi.password=${UNOMI_PASSWORD:karaf}
app.unomi.scope=${UNOMI_SCOPE:my-vnpost-app}
app.unomi.connection-timeout-ms=${UNOMI_CONNECTION_TIMEOUT_MS:5000}
app.unomi.response-timeout-ms=${UNOMI_RESPONSE_TIMEOUT_MS:15000}
